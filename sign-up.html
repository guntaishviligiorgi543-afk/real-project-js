<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create account | Luma Supply</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">L</span><span>Luma<span class="brand-light">Supply</span></span></a><button class="burger-menu-btn" id="burger-menu-btn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button><nav class="desktop-nav" aria-label="Primary navigation"><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="header-actions"><a class="icon-link" href="cart.html" aria-label="Cart"><svg><use href="assets/icons/icons.svg#bag"></use></svg><span id="cart-count" class="cart-badge">0</span></a><a href="sign-in.html">Sign in</a></div><nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation"><div class="mobile-menu-header"><span>Menu</span><button class="mobile-menu-close" id="mobile-menu-close" type="button" aria-label="Close navigation menu"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"></path></svg></button></div><div class="mobile-menu-links"><a href="index.html">Home</a><a href="products.html">Products</a><a href="about.html">About</a><a href="contact.html">Contact</a></div><div class="mobile-menu-account"><p>Account</p><a class="auth-guest-mobile" href="sign-in.html">Sign in</a><a class="auth-guest-mobile" href="sign-up.html">Sign up</a><a class="auth-user-mobile is-hidden" href="profile.html">My profile</a><a class="auth-user-mobile is-hidden" href="cart.html">My cart</a><button class="auth-user-mobile is-hidden link-button" type="button">Sign out</button></div></nav></div></header><div class="mobile-menu-overlay" id="mobile-menu-overlay" aria-hidden="true"></div>
    <main class="auth-page">
      <section class="auth-card">
        <a class="brand" href="index.html"
          ><span class="brand-mark">L</span
          ><span>Luma<span class="brand-light">Supply</span></span></a
        >
        <h1>Create account.</h1>
        <p>Join Luma Supply for a more personal shopping experience.</p>
        <form id="sign-up-form" class="auth-form" novalidate>
          <div class="field-row">
            <div class="field">
              <label for="first-name">First name</label
              ><input
                id="first-name"
                name="firstName"
                type="text"
                autocomplete="given-name"
                required
              /><span class="field-error"></span>
            </div>
            <div class="field">
              <label for="last-name">Last name</label
              ><input
                id="last-name"
                name="lastName"
                type="text"
                autocomplete="family-name"
                required
              /><span class="field-error"></span>
            </div>
          </div>
          <div class="field">
            <label for="sign-up-email">Email address</label
            ><input
              id="sign-up-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            /><span class="field-error" data-error-for="email"></span>
          </div>
          <div class="field">
            <label for="phone">Phone <small>(optional)</small></label
            ><input
              id="phone"
              name="phone"
              type="tel"
              autocomplete="tel"
            /><span class="field-error"></span>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="sign-up-password">Password</label
              ><input
                id="sign-up-password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
              /><span class="field-error"></span>
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label
              ><input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                autocomplete="new-password"
                required
              /><span class="field-error"></span>
            </div>
          </div>
          <label class="check-row"
            ><input id="terms" name="terms" type="checkbox" required /> I agree
            to the terms and privacy policy.</label
          >
          <p id="sign-up-message" class="form-message" role="alert"></p>
          <button class="button" type="submit">Create account</button>
        </form>
        <p class="form-footer">
          Already have an account? <a href="sign-in.html">Sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
